name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate skills
        run: bash scripts/check.sh
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
